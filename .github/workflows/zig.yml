name: Zig 0.17 qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  source:
    name: Source preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.0'
          use-cache: false
      - name: Check source accounting and formatting
        run: |
          git ls-files '*.zig' | LC_ALL=C sort | diff -u repo_zig_paths.txt -
          xargs zig fmt --check < repo_zig_paths.txt
      - name: Enforce TigerStyle on all tracked Zig source
        env:
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tools/tiger-style.sh --all "$HEAD_REF"
      - name: Verify TigerStyle selection and failure behavior
        run: bash tools/test-tiger-style.sh
  qualify:
    name: Qualification / ${{ matrix.lane }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        lane: [installation, contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: matrix.lane == 'contracts'
        with:
          node-version: '26.9.0'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.0'
          use-cache: false
      - name: Restore complete compiler cache
        id: cache
        if: matrix.lane == 'contracts'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .zig-cache-upload
          key: horos-native-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ hashFiles('build.zig.zon') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            horos-native-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ hashFiles('build.zig.zon') }}-
      - name: Select working cache
        if: matrix.lane == 'contracts'
        run: |
          if [ -d .zig-cache-upload ]; then
            test ! -e .zig-cache
            mv .zig-cache-upload .zig-cache
          fi
          mkdir -p .zig-cache/tmp
      - name: Run selected native build root
        run: |
          if [ "${{ matrix.lane }}" = installation ]; then
            zig build check-package -Doptimize=safe --summary all
          else
            zig build check -Doptimize=safe --summary all
          fi
      - name: Admit complete bounded compiler cache
        id: cache_size
        if: ${{ !cancelled() && matrix.lane == 'contracts' }}
        continue-on-error: true
        run: |
          echo 'save=false' >> "$GITHUB_OUTPUT"
          test -d .zig-cache/o || exit 0
          test -z "$(find .zig-cache ! -type d ! -type f -print -quit)" || exit 0
          test -n "$(find .zig-cache/o -type f -size +0c -print -quit)" || exit 0
          bytes=$(find .zig-cache -type f -printf '%s\n' | awk '{n+=$1} END {printf "%.0f",n}')
          echo "Compiler cache: $bytes bytes (4 GiB upload maximum)"
          test "$bytes" -le 4294967296 || exit 0
          test ! -e .zig-cache-upload
          cp -al .zig-cache .zig-cache-upload
          echo 'save=true' >> "$GITHUB_OUTPUT"
      - name: Save useful cache without deleting outputs
        if: ${{ !cancelled() && steps.cache_size.outputs.save == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .zig-cache-upload
          key: horos-native-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ hashFiles('build.zig.zon') }}-${{ github.run_id }}-${{ github.run_attempt }}
  native:
    name: native
    needs: [source, qualify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require source and both qualification lanes
        env:
          SOURCE: ${{ needs.source.result }}
          QUALIFICATION: ${{ needs.qualify.result }}
        run: |
          test "$SOURCE" = success
          test "$QUALIFICATION" = success
