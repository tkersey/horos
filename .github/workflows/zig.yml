name: Zig 0.17 qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: Source preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.0'
          use-cache: false
      - name: Check source accounting and formatting
        run: |
          git ls-files '*.zig' | LC_ALL=C sort | diff -u repo_zig_paths.txt -
          xargs zig fmt --check < repo_zig_paths.txt
      - name: Enforce TigerStyle on all tracked Zig source
        env:
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tools/tiger-style.sh --all "$HEAD_REF"
      - name: Verify TigerStyle selection and failure behavior
        run: bash tools/test-tiger-style.sh
  qualify:
    name: Qualification / ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [installation, contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: matrix.lane == 'contracts'
        with:
          node-version: '26.9.0'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.0'
          use-cache: false
      - name: Restore complete compiler cache
        id: cache
        if: matrix.lane == 'contracts'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .zig-cache-upload
          key: horos-native-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ hashFiles('build.zig.zon') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            horos-native-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ hashFiles('build.zig.zon') }}-
            horos-native-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-
      - name: Select working cache
        if: matrix.lane == 'contracts'
        run: |
          if [ -d .zig-cache-upload ]; then
            test ! -e .zig-cache
            mv .zig-cache-upload .zig-cache
          fi
          mkdir -p .zig-cache/tmp
      - name: Run selected native build root
        run: |
          if [ "${{ matrix.lane }}" = installation ]; then
            zig build check-package -Doptimize=safe --summary all
          else
            zig build check -Doptimize=safe --summary all --verbose
          fi
      - name: Inspect failed native package executable
        if: ${{ failure() && matrix.lane == 'installation' }}
        shell: bash
        run: |
          command -v gdb || sudo apt-get install --yes gdb
          cat > "$RUNNER_TEMP/package-diagnose.gdb" <<'GDB'
          set pagination off
          run
          python
          if gdb.selected_inferior().pid:
              for command in ('x/12i $pc-16', 'info registers', 'bt', 'frame 0', 'info args'):
                  gdb.execute(command)
          end
          GDB
          while IFS= read -r executable; do
            timeout 30s gdb --batch -x "$RUNNER_TEMP/package-diagnose.gdb" "$executable"
          done < <(find .zig-cache -path '*/package/*/local/o/*/test' -type f)
      - name: Admit complete bounded compiler cache
        id: cache_size
        if: ${{ !cancelled() && matrix.lane == 'contracts' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo 'save=false' >> "$GITHUB_OUTPUT"
          started=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .run_started_at)
          elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
          if [ "$elapsed" -ge 480 ]; then
            echo 'Leaving compiler cache in place; insufficient time for optional upload.'
            exit 0
          fi
          test -d .zig-cache/o || exit 0
          test -z "$(find .zig-cache ! -type d ! -type f -print -quit)" || exit 0
          test -n "$(find .zig-cache/o -type f -size +0c -print -quit)" || exit 0
          bytes=$(find .zig-cache -type f -printf '%s\n' | awk '{n+=$1} END {printf "%.0f",n}')
          echo "Compiler cache: $bytes bytes (4 GiB upload maximum)"
          test "$bytes" -le 4294967296 || exit 0
          test ! -e .zig-cache-upload
          cp -al .zig-cache .zig-cache-upload
          echo 'save=true' >> "$GITHUB_OUTPUT"
      - name: Save useful cache without deleting outputs
        if: ${{ !cancelled() && steps.cache_size.outputs.save == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .zig-cache-upload
          key: horos-native-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ hashFiles('build.zig.zon') }}-${{ github.run_id }}-${{ github.run_attempt }}
  native:
    name: native
    needs: [source, qualify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require source and both qualification lanes
        env:
          SOURCE: ${{ needs.source.result }}
          QUALIFICATION: ${{ needs.qualify.result }}
        run: |
          test "$SOURCE" = success
          test "$QUALIFICATION" = success
  native-backend-diagnostic:
    name: Native backend crash diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.0'
          use-cache: false
      - name: Inspect UTF-8 validation without LLVM
        shell: bash
        run: |
          set -uo pipefail
          command -v gdb || sudo apt-get install --yes gdb
          lscpu
          cat > "$RUNNER_TEMP/probe.zig" <<'ZIG'
          const std = @import("std");
          noinline fn valid(bytes: []const u8) bool {
              return std.unicode.utf8ValidateSlice(bytes);
          }
          test "unicode aligned and unaligned bytes" {
              var bytes: [160]u8 align(64) = @splat('a');
              std.mem.doNotOptimizeAway(&bytes);
              std.debug.print("vector width={?d}\n", .{std.simd.suggestVectorLength(u8)});
              for (0..64) |offset| {
                  for ([_]usize{ 15, 16, 17, 31, 32, 33, 64 }) |len| {
                      std.debug.print("offset={d} length={d} pointer=0x{x}\n", .{ offset, len, @intFromPtr(&bytes[offset]) });
                      try std.testing.expect(valid(bytes[offset..][0..len]));
                  }
              }
          }
          test "stringify static array pointer" {
              const text = try std.json.Stringify.valueAlloc(std.testing.allocator, .{
                  .template = "boundary.library.exchange/v1",
                  .result = "library.runtime.generator.Generator",
                  .evidence_type = "struct { []const u8, u32, u32, u32, []const u32 }",
              }, .{});
              defer std.testing.allocator.free(text);
              try std.testing.expect(text.len != 0);
          }
          ZIG
          cat > "$RUNNER_TEMP/diagnose.gdb" <<'GDB'
          set pagination off
          run
          python
          if gdb.selected_inferior().pid:
              for command in ('x/12i $pc-16', 'info registers', 'bt', 'frame 0', 'info args'):
                  gdb.execute(command)
          end
          GDB
          cat > "$RUNNER_TEMP/peer.zig" <<'ZIG'
          const std = @import("std");
          const Result = struct { input: u64, element: u64, result: u64, package: u64 };
          const Row = struct { effects: []const u64 };
          pub noinline fn construct(allocator: std.mem.Allocator) ![]u8 {
              const ids: []const u64 = &.{};
              const identity: []const u8 = "package/source-exchange";
              const evidence = .{ identity, @as(u64, 0), @as(u64, 0), @as(u64, 0), ids, ids, ids, Row{ .effects = ids } };
              const template: []const u8 = "boundary.library.exchange/v1";
              return std.json.Stringify.valueAlloc(allocator, .{
                  .template = template,
                  .result = @typeName(Result),
                  .evidence_type = @typeName(@TypeOf(evidence)),
                  .evidence = evidence,
              }, .{});
          }
          ZIG
          cat > "$RUNNER_TEMP/root.zig" <<'ZIG'
          const std = @import("std");
          const peer = @import("peer");
          test "mixed module specialization evidence" {
              const text = try peer.construct(std.testing.allocator);
              defer std.testing.allocator.free(text);
              try std.testing.expect(text.len != 0);
          }
          ZIG
          for cpu in native baseline; do
            for probe in unicode stringify; do
              binary="$RUNNER_TEMP/$cpu-$probe"
              zig test "$RUNNER_TEMP/probe.zig" -fno-llvm -O debug -mcpu="$cpu" \
                --test-filter "$probe" --test-no-exec -femit-bin="$binary" || exit 1
              gdb --batch -x "$RUNNER_TEMP/diagnose.gdb" "$binary" 2>&1 \
                | tee "$RUNNER_TEMP/$cpu-$probe.log"
            done
            binary="$RUNNER_TEMP/$cpu-mixed"
            zig test -fno-llvm -O debug -mcpu=native --dep peer -Mroot="$RUNNER_TEMP/root.zig" \
              -O safe -mcpu="$cpu" -Mpeer="$RUNNER_TEMP/peer.zig" \
              --test-no-exec -femit-bin="$binary" || exit 1
            gdb --batch -x "$RUNNER_TEMP/diagnose.gdb" "$binary" 2>&1 \
              | tee "$RUNNER_TEMP/$cpu-mixed.log"
          done
      - name: Retain native diagnostic binaries and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-backend-diagnostic
          path: |
            ${{ runner.temp }}/probe.zig
            ${{ runner.temp }}/peer.zig
            ${{ runner.temp }}/root.zig
            ${{ runner.temp }}/*-mixed*
            ${{ runner.temp }}/native-unicode*
            ${{ runner.temp }}/native-stringify*
            ${{ runner.temp }}/baseline-unicode*
            ${{ runner.temp }}/baseline-stringify*
          retention-days: 7
