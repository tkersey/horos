name: Repository-local release tooling
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-tools-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.9.0'
      - name: Test release boundaries
        run: node --test tools/release/*.test.mjs
      - name: Archive exact source candidate
        if: ${{ always() }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-source"
          git --no-replace-objects archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/release-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/release-source/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/release-source/tree.txt"
          cd "$RUNNER_TEMP/release-source"
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: horos-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/release-source/
          if-no-files-found: error
          retention-days: 14
